name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install
      - run: bun run check
      - name: Validate DNS curation logic
        run: python3 -m unittest discover -s scripts -p 'test_curate_iptv_sources.py'
      - run: bun run test
      - run: bun run --cwd apps/web build
