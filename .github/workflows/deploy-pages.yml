name: Deploy YouTV to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install
      - name: Test and typecheck
        run: bun run check && bun run test
      - name: Resolve GitHub Pages base path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          CUSTOM_BASE: ${{ vars.YOUTV_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "VITE_BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
          elif [ "$REPO_NAME" = "$REPO_OWNER.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Build static app
        run: bun run --cwd apps/web build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
