name: Deploy YouTV to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and typecheck
        run: bun run check && bun run test
      - name: Run source-curation tests and install DNS resolver
        run: |
          python3 -m unittest discover -s scripts -p 'test_curate_iptv_sources.py'
          python3 -m pip install 'dnspython>=2.7,<3'
      - name: Merge and check original IPTV sources
        run: |
          python3 scripts/curate_iptv_sources.py \
            --input apps/web/public/sources \
            --include apps/web/public/default.m3u8 \
            --output apps/web/public/sources/_verified \
            --archive .artifacts/iptv-curation \
            --workers 48 --min-online 1
          # Only DNS-resolved entries become the deployed default playlist.
          # This modifies the disposable CI checkout, NOT the source repository.
          cp apps/web/public/sources/_verified/online.m3u8 apps/web/public/default.m3u8
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('apps/web/public/sources/_verified/summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## IPTV DNS curation\n\nDNS resolution does not prove a stream is playable.\n\n')
              for key in ('sourceFiles','uniqueUrls','verifiedUrls','duplicates','invalidUrls'):
                  f.write(f'- {key}: {report[key]:,}\n')
              for key,value in report['archived'].items():
                  f.write(f'- archived {key}: {value:,}\n')
          PY
      - name: Save excluded and duplicate channels as a recoverable archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtv-iptv-dns-archive
          path: .artifacts/iptv-curation/
          if-no-files-found: warn
          retention-days: 90
      - name: Resolve GitHub Pages base path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          CUSTOM_BASE: ${{ vars.YOUTV_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "VITE_BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
          elif [ "$REPO_NAME" = "$REPO_OWNER.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Build curated static app (no raw/dead sources published)
        env:
          YOUTV_CURATED: '1'
          VITE_YOUTV_CURATED: '1'
        run: bun run --cwd apps/web build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
